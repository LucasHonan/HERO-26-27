; Rover drive firmware — Nucleo-H755ZI-Q (Cortex-M7 core only).
;
;   pio run -e nucleo_h755zi_q            build
;   pio run -e nucleo_h755zi_q -t upload  flash over the on-board ST-LINK
;   pio test -e native                    run logic unit tests on your laptop

[platformio]
default_envs = nucleo_h755zi_q

[env:nucleo_h755zi_q]
platform = ststm32
board = nucleo_h755zi_q
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -Iinclude
    -Wall
    -Wextra
    -Wno-unused-parameter
lib_ldf_mode = deep+

[env:native]
platform = native
test_build_src = no
build_flags = -Wall -Wextra -lm -Iinclude
